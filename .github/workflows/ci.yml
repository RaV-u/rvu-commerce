name: RVU Commerce - Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  portable-checks:
    name: Typecheck, build, portable tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          NODE_ENV: test
          RVU_TEST_DIAGNOSTICS: '1'
      - run: npm run test:ui
