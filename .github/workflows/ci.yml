name: RVU Commerce - Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  portable-checks:
    name: Typecheck, build, PostgreSQL and UI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          NODE_ENV: test
          RVU_TEST_DIAGNOSTICS: '1'
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      - run: npm run test:ui

  portable-pglite:
    name: Portable Fastify and SQL tests (PGlite)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify portable business workflows
        run: npm test

  docker-smoke:
    name: Docker Compose, proxy and purchase smoke test
    needs: [portable-checks, portable-pglite]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Prepare disposable CI credentials
        run: |
          cat > .env <<'EOF'
          DB_PASSWORD=CI-local-owner-Password-Only-2026
          STORE_DB_PASSWORD=CI-local-store-Password-Only-2026
          CONTROL_DB_PASSWORD=CI-local-control-Password-Only-2026
          INSTRUCTOR_PASSWORD=CI-local-instructor-Password-Only-2026
          EOF
          chmod 600 .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start isolated application
        run: docker compose up --build --wait --wait-timeout 180
      - name: Wait for published HTTP ports
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS -H 'Host: localhost:8080' http://127.0.0.1:8080/api/health >/dev/null &&
               curl -fsS -H 'Host: 127.0.0.1:8081' http://127.0.0.1:8081/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Exercise real proxy, application and PostgreSQL
        run: node scripts/smoke.mjs
      - name: Show service diagnostics on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Remove CI containers and volumes
        if: always()
        run: docker compose down -v --remove-orphans
