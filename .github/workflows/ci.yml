name: RVU Commerce - Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  portable-checks:
    name: Typecheck, build, PostgreSQL and UI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          NODE_ENV: test
          RVU_TEST_DIAGNOSTICS: '1'
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      - run: npm run test:ui

  portable-pglite:
    name: Portable Fastify and SQL tests (PGlite)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify portable business workflows
        run: npm test

  cart-wallet-regression:
    name: Independent two-account cart and refund check
    needs: [portable-checks, portable-pglite]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Prepare disposable database credentials
        run: |
          cat > .env <<'EOF'
          DB_PASSWORD=CI-money-owner-Password-Only-2026
          STORE_DB_PASSWORD=CI-money-store-Password-Only-2026
          CONTROL_DB_PASSWORD=CI-money-control-Password-Only-2026
          EOF
          chmod 600 .env
      - name: Start a clean commerce installation
        run: docker compose up --build --wait --wait-timeout 180
      - name: Verify basket changes and financial transactions
        run: node scripts/smoke-money-cart.mjs
        env:
          RVU_DISPOSABLE_CI: 'yes'
      - name: Collect service diagnostics
        if: failure()
        run: docker compose logs --tail=100
      - name: Remove test environment
        if: always()
        run: docker compose down -v --remove-orphans

  remaining-lab-regression:
    name: Additional security lab and unexpected-input tests
    needs: [portable-checks, portable-pglite]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Provision disposable Docker credentials
        run: |
          cat > .env <<'EOF'
          DB_PASSWORD=CI-labs-owner-Password-Only-2026
          STORE_DB_PASSWORD=CI-labs-store-Password-Only-2026
          CONTROL_DB_PASSWORD=CI-labs-control-Password-Only-2026
          EOF
          chmod 600 .env
      - name: Start isolated lab instance
        run: docker compose up --build --wait --wait-timeout 180
      - name: Exercise account and time-window bugs alongside input validation
        run: node scripts/smoke-remaining-labs.mjs
        env:
          RVU_DISPOSABLE_CI: 'yes'
      - name: Collect diagnostics on failures
        if: failure()
        run: docker compose logs --tail=100
      - name: Remove disposable data
        if: always()
        run: docker compose down -v --remove-orphans

  docker-smoke:
    name: Docker Compose, proxy and purchase smoke test
    needs: [portable-checks, portable-pglite]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Prepare disposable CI credentials
        run: |
          cat > .env <<'EOF'
          DB_PASSWORD=CI-local-owner-Password-Only-2026
          STORE_DB_PASSWORD=CI-local-store-Password-Only-2026
          CONTROL_DB_PASSWORD=CI-local-control-Password-Only-2026
          EOF
          chmod 600 .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start isolated application
        run: docker compose up --build --wait --wait-timeout 180
      - name: Verify runtime image includes no source, tests, or instructor interface
        run: |
          docker compose run --rm --no-deps store sh -ec '
            test -f dist/server/main.js
            test -f dist/server/migrate.js
            test -f dist/server/reset-local.js
            test ! -d apps
            test ! -d tests
            test ! -d docs
            test ! -d dist/control
          '
      - name: Wait for published HTTP ports
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS -H 'Host: localhost:8081' http://127.0.0.1:8081/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Exercise real proxy, application and PostgreSQL
        run: node scripts/smoke.mjs
      - name: Start a clean run for integrated business weakness checks
        run: docker compose run --rm migrate node dist/server/reset-local.js RESET
      - name: Recheck customer sessions and normal payment flow
        run: node scripts/smoke.mjs
      - name: Start a clean run for promotions and vouchers
        run: docker compose run --rm migrate node dist/server/reset-local.js RESET
      - name: Verify additional promotion, payment and voucher scenarios together
        run: node scripts/smoke-commerce-integrated.mjs
        env:
          RVU_DISPOSABLE_CI: 'yes'
      - name: Start a clean run for two-account consistency checks
        run: docker compose run --rm migrate node dist/server/reset-local.js RESET
      - name: Check two persistent accounts after training scenarios
        run: node scripts/smoke-stability.mjs
        env:
          RVU_DISPOSABLE_CI: 'yes'
      - name: Verify repeatable local reset without the instructor website
        run: |
          docker compose run --rm migrate node dist/server/reset-local.js RESET
          node scripts/smoke.mjs
      - name: Render storefront in headless Chrome
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser" || { echo "Chrome headless is not available on this runner"; exit 1; }
          mkdir -p artifacts
          timeout 45s "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4500 --window-size=1365,900 --dump-dom http://localhost:8081/ > artifacts/storefront-dom.html
          grep -q 'Learn the logic' artifacts/storefront-dom.html
          timeout 45s "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=1365,900 --screenshot=artifacts/storefront.png http://localhost:8081/
          test -s artifacts/storefront.png
          timeout 45s "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=420,900 --screenshot=artifacts/storefront-mobile.png http://localhost:8081/
          test -s artifacts/storefront-mobile.png
      - name: Check mobile layout overflow at 420px and 360px
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          RVU_CHROME="$browser" node scripts/check-mobile-layout.mjs
      - name: Create and validate single distribution
        run: |
          bash -n student/setup.sh student/install.sh student/stop.sh student/reset.sh student/update.sh scripts/export-student-package.sh
          docker compose --env-file .env -f student/compose.yaml config --quiet
          bash scripts/export-student-package.sh
          archive=dist-packages/RVU-Commerce.tar.gz
          test -s "$archive"
          tar -tzf "$archive" | grep -q 'RVU-Commerce/install.sh'
          tar -tzf "$archive" | grep -q 'RVU-Commerce/setup.sh'
          tar -tzf "$archive" | grep -q 'RVU-Commerce/update.sh'
          tar -tzf "$archive" | grep -q 'RVU-Commerce/images.tar.gz'
          if tar -tzf "$archive" | grep -Eq '/(apps|tests|docs|node_modules)/'; then
            echo 'The student package unexpectedly contains source or instructor material'
            exit 1
          fi
      - name: Publish downloadable common package
        uses: actions/upload-artifact@v4
        with:
          name: RVU-Commerce-Installer
          path: dist-packages/RVU-Commerce.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Test one-version installation and update
        run: |
          docker compose down --remove-orphans
          mkdir -p "$RUNNER_TEMP/rvu-unified-test"
          (
            cd "$RUNNER_TEMP/rvu-unified-test"
            RVU_INSTALL_DIR="$PWD/RVU-Commerce-install" \
            RVU_PACKAGE_URL="file://$GITHUB_WORKSPACE/dist-packages/RVU-Commerce.tar.gz" \
              bash "$GITHUB_WORKSPACE/student/setup.sh"
            cd RVU-Commerce-install
            test -s .env
            before="$(sha256sum .env | cut -d ' ' -f 1)"
            RVU_PACKAGE_URL="file://$GITHUB_WORKSPACE/dist-packages/RVU-Commerce.tar.gz" bash update.sh
            after="$(sha256sum .env | cut -d ' ' -f 1)"
            test "$before" = "$after"
            docker compose ps
          )
          node scripts/smoke.mjs
      - name: Save review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rvu-commerce-browser-review
          path: |
            artifacts/storefront.png
            artifacts/storefront-mobile.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Show service diagnostics on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Remove student edition CI containers and volumes
        if: always()
        run: docker compose --env-file .env -f student/compose.yaml down -v --remove-orphans || true
      - name: Remove CI containers and volumes
        if: always()
        run: docker compose down -v --remove-orphans

  publish-common-release:
    name: Publish universal GitHub download
    needs: [docker-smoke, cart-wallet-regression, remaining-lab-regression]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Download fully tested common installer
        uses: actions/download-artifact@v4
        with:
          name: RVU-Commerce-Installer
          path: release-assets
      - name: Publish stable single-version release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          asset=release-assets/RVU-Commerce.tar.gz
          cp student/setup.sh student/update.sh release-assets/
          test -s "$asset"
          test -s release-assets/setup.sh
          test -s release-assets/update.sh
          if gh release view rvu-latest >/dev/null 2>&1; then
            gh release upload rvu-latest "$asset" release-assets/setup.sh release-assets/update.sh --clobber
          else
            gh release create rvu-latest "$asset" release-assets/setup.sh release-assets/update.sh \
              --title "RVU Commerce - Universal Installer" \
              --notes "One identical Docker distribution for the instructor and learners. Windows: enable Ubuntu WSL2 integration in Docker Desktop. Linux: use Docker Engine. Download setup.sh and execute bash setup.sh to run the local site on http://localhost:8081." \
              --target "$GITHUB_SHA" --latest
          fi
          gh release view rvu-latest --json assets --jq '.assets[] | select(.name=="RVU-Commerce.tar.gz" or .name=="setup.sh" or .name=="update.sh") | .url'
          if gh release view student-latest >/dev/null 2>&1; then
            gh release delete student-latest --yes --cleanup-tag
          fi
